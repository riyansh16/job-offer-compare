name: Refresh ratings (daily, small batch)

# Runs every day at 21:30 UTC (03:00 IST). Off-peak for user traffic.
#
# The 9 Gemini keys are now DEDICATED to this cron: user-facing offer-letter
# extraction moved off Gemini to Azure OpenAI (commit a563a96) because the
# free Gemini API geo-blocks our Azure host region. So the whole free flash
# pool (~250 RPD/key x 9 keys = ~2250 RPD) is available here, vs the ~40
# calls/day below (<2%). We still spread the work across two daily slices
# (rather than one monthly bulk dump) so a transient outage only costs a day
# and the catalog stays evenly fresh.
#   * Bulk slice: 30 stalest catalog rows (flash). Cycles all ~313 companies
#     in ~10-11 days, re-checking successes and filling fresh gaps.
#   * Escalation slice: 10 oldest rows still missing a rating (flash),
#     INCLUDING ones the give-up gate retired (--include-stuck -> fc>=1), so
#     the long-tail empties get re-tried instead of being stranded at fc>=2.
# flash's ~50% hit-rate is the best free option (flash-lite's ~22% was too
# low; pro went paid-tier-only on May 30, 2026 with 0 free-tier RPD). Calls
# are throttled to ~4 RPM (14s interval) to stay under the per-key RPM cap;
# key rotation only kicks in if a key hits its daily limit, which 40 calls
# won't. Total daily Gemini calls: ~40. Time on the runner: ~12 min.
#
# Required GitHub Actions secrets:
#   DATABASE_URL              - prod Postgres connection string
#   GEMINI_API_KEY            - primary Gemini key
#   GEMINI_API_KEY_2 .. _10   - rotation keys (optional but recommended)

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Bulk slice size (default 30)'
        required: false
        default: '30'
      escalate_max:
        description: 'Escalation slice size (default 10)'
        required: false
        default: '10'

concurrency:
  group: refresh-ratings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
      GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
      GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
      GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
      GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
      BATCH_SIZE: ${{ github.event.inputs.batch_size || '30' }}
      ESCALATE_MAX: ${{ github.event.inputs.escalate_max || '10' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      # GEMINI_RATINGS_MODEL is read at module-load time by
      # src/lib/providers/llmRatings.ts, so setting it on the step is enough to
      # make the bulk slice use flash instead of the library default flash-lite.
      - name: Bulk slice (flash, ${{ env.BATCH_SIZE }} stalest)
        env:
          GEMINI_RATINGS_MODEL: gemini-2.5-flash
        run: npx tsx scripts/refreshRatings.ts --batch-size=${{ env.BATCH_SIZE }} --interval-ms=14000

      # --include-stuck broadens the candidate filter from fc==1 to fc>=1 so the
      # rows the daily gate already gave up on (fc>=2) get re-tried with flash.
      - name: Escalation slice (flash, ${{ env.ESCALATE_MAX }} oldest stuck incl. given-up)
        run: npx tsx scripts/escalateMissingRatings.ts --model=gemini-2.5-flash --interval-ms=14000 --max=${{ env.ESCALATE_MAX }} --include-stuck
