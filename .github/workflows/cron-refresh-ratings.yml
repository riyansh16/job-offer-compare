name: Refresh ratings (daily, small batch)

# Runs every day at 21:30 UTC (03:00 IST). Off-peak for user traffic.
#
# We CANNOT do a bulk monthly dump because the 9 Gemini keys are shared with
# user-facing PDF / image offer extraction (gemini-2.5-flash). A 238-call
# burst would either trip per-minute rate limits or starve a user upload
# happening at the same time. The daily slices below are tiny (~15 calls,
# throttled to ~4 RPM), so they coexist comfortably with user uploads.
#
# Instead: two small slices each day that cycle the catalog naturally. BOTH
# now use gemini-2.5-flash. flash-lite's ~22% Indeed-extraction hit-rate was
# too low to be worth its separate quota pool, and pro (the old escalation
# model, ~85%) went paid-tier-only on May 30, 2026 (free-tier projects get
# 0 RPD per `GenerateRequestsPerDayPerProjectPerModel-FreeTier`). flash's
# ~50% hit-rate is the best free option, and ~15 calls/day is <1% of the
# 250 RPD/key flash pool (×9 keys ≈ 2250 RPD).
#   * Bulk slice: 10 stalest catalog rows (flash). Cycles all ~310 companies
#     in ~31 days, re-checking successes and filling fresh gaps.
#   * Escalation slice: 5 oldest rows still missing a rating (flash),
#     INCLUDING ones the give-up gate retired (--include-stuck → fc>=1), so
#     the long-tail empties get re-tried instead of being stranded at fc>=2.
# Total daily Gemini calls: ~15. Time on the runner: ~5 min.
#
# Required GitHub Actions secrets:
#   DATABASE_URL              - prod Postgres connection string
#   GEMINI_API_KEY            - primary Gemini key
#   GEMINI_API_KEY_2 .. _10   - rotation keys (optional but recommended)

on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Bulk slice size (default 10)'
        required: false
        default: '10'
      escalate_max:
        description: 'Escalation slice size (default 5)'
        required: false
        default: '5'

concurrency:
  group: refresh-ratings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
      GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
      GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
      GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
      GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
      BATCH_SIZE: ${{ github.event.inputs.batch_size || '10' }}
      ESCALATE_MAX: ${{ github.event.inputs.escalate_max || '5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      # GEMINI_RATINGS_MODEL is read at module-load time by
      # src/lib/providers/llmRatings.ts, so setting it on the step is enough to
      # make the bulk slice use flash instead of the library default flash-lite.
      - name: Bulk slice (flash, ${{ env.BATCH_SIZE }} stalest)
        env:
          GEMINI_RATINGS_MODEL: gemini-2.5-flash
        run: npx tsx scripts/refreshRatings.ts --batch-size=${{ env.BATCH_SIZE }} --interval-ms=14000

      # --include-stuck broadens the candidate filter from fc==1 to fc>=1 so the
      # rows the daily gate already gave up on (fc>=2) get re-tried with flash.
      - name: Escalation slice (flash, ${{ env.ESCALATE_MAX }} oldest stuck incl. given-up)
        run: npx tsx scripts/escalateMissingRatings.ts --model=gemini-2.5-flash --interval-ms=14000 --max=${{ env.ESCALATE_MAX }} --include-stuck
